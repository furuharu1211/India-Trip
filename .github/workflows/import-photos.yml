name: Import sightseeing photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-photos.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate Commons images
        run: python3 scripts/import-photos.py
      - name: Commit local photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/trip.js config/sightseeing.js images photo-credits.html
          if ! git diff --cached --quiet; then
            git commit -m "Store verified sightseeing photos locally"
            git push
          fi
